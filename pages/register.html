<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Регистрация - Читака</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <div class="header-content">
      <a href="/index.html" class="logo">Читака</a>
      <ul class="nav-menu">
        <li><a href="/index.html">Главная</a></li>
        <li><a href="/pages/search.html">Поиск</a></li>
        <li><a href="/pages/login.html" class="auth-btn">Войти</a></li>
      </ul>
      <div class="burger-menu">
        <div class="burger-line"></div>
        <div class="burger-line"></div>
        <div class="burger-line"></div>
      </div>
    </div>
  </header>

  <main>
    <div class="form-container">
      <h2 class="form-title">Регистрация</h2>
      <form id="register-form">
        <div class="form-group">
          <label for="name" class="form-label">Имя</label>
          <input type="text" id="name" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="email" class="form-label">Email</label>
          <input type="email" id="email" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="password" class="form-label">Пароль</label>
          <input type="password" id="password" class="form-input" required>
        </div>
        <div class="form-group">
          <label for="confirm-password" class="form-label">Подтверждение пароля</label>
          <input type="password" id="confirm-password" class="form-input" required>
        </div>
        <button type="submit" class="form-btn">Зарегистрироваться</button>
        <div class="message"></div>
      </form>
      <div class="form-link">
        <p>Уже есть аккаунт? <a href="/pages/login.html">Войти</a></p>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2025 Читака. Проект студентов УрФУ</p>
  </footer>

  <script src="/script.js"></script>
</body>
</html>
